<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem('color-scheme') ?? 'light dark';
      } catch {}
    </script>
    <meta name="theme-color" content="#1c2128" />
    <meta name="description" content="Simple, sleek iPod-like Quran recitation audio player for kids" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hafz" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./public/icons/icon.svg" />
    <link rel="apple-touch-icon" href="./public/icons/apple-touch-icon.png" />
    <title>Hafz — Quran Audio Player</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="ipod-frame" id="ipod-frame">
        <header class="ipod-topbar">
          <div class="brand-group">
            <span class="brand-title">Hafz</span>
            <span id="track-count-badge" class="status-badge">0 tracks</span>
          </div>
          <div class="topbar-badges">
            <span id="loading-badge" class="status-badge status-loading" hidden>Loading…</span>
            <span id="repeat-badge" class="status-badge">Repeat All</span>
            <button
              id="btn-theme"
              type="button"
              class="theme-toggle-btn"
              aria-label="Toggle color theme"
            >
              Theme
            </button>
          </div>
        </header>

        <div class="ipod-screen" id="ipod-screen" data-view="now-playing">
          <!-- Screen View 1: Now Playing Card -->
          <div id="view-now-playing" class="screen-view screen-now-playing">
            <div class="now-playing-card" id="now-playing-summary">
              <div class="recitation-emblem" aria-hidden="true">
                <span class="emblem-icon">﴾﴿</span>
              </div>
              <p class="screen-subtitle" id="current-subtitle">Drop or load Quran recordings</p>
              <h1 class="screen-title" id="current-title">Ready to Listen</h1>
              <div class="now-playing-badges-row">
                <p class="screen-ayat-badge" id="current-ayat">Select a track to begin</p>
                <button
                  id="btn-quran"
                  type="button"
                  class="read-quran-btn"
                  aria-pressed="false"
                  aria-label="Read Quran Page"
                >
                  📖 Read Page
                </button>
              </div>
            </div>

            <div class="progress-section">
              <label for="seek-slider" class="visually-hidden">Seek playback position</label>
              <input
                id="seek-slider"
                class="seek-slider"
                type="range"
                min="0"
                max="100"
                step="0.1"
                value="0"
              />
              <div class="time-row">
                <span id="current-time">00:00</span>
                <span id="remaining-time">-00:00</span>
                <span id="total-duration">00:00</span>
              </div>
            </div>
          </div>

          <!-- Screen View 2: Track Browser & Grouped Playlist -->
          <div id="view-browser" class="screen-view screen-browser" inert>
            <div class="filter-bar">
              <label for="playlist-filter" class="filter-label">Filter:</label>
              <select id="playlist-filter" class="filter-select">
                <option value="all">All Tracks (0)</option>
              </select>
            </div>

            <ul id="track-list" class="track-list" role="list"></ul>
          </div>

          <!-- Screen View 3: Quran Mushaf Page Reader -->
          <div id="view-quran" class="screen-view screen-quran" inert>
            <div class="quran-reader-header">
              <div class="quran-reader-titles">
                <span id="quran-page-badge" class="quran-page-badge">Mushaf Page 1</span>
                <span id="quran-meta-badge" class="quran-meta-badge">Juz 01 • Page 01</span>
              </div>
              <button
                id="btn-quran-close"
                type="button"
                class="quran-close-btn"
                aria-label="Back to Now Playing"
              >
                ✕ Close
              </button>
            </div>

            <div class="quran-mushaf-sheet">
              <div id="quran-surah-arabic" class="quran-surah-banner" lang="ar" dir="rtl">
                ٱلْقُرْآنُ ٱلْكَرِيمُ
              </div>
              <div
                id="quran-verses"
                class="quran-verses-box"
                lang="ar"
                dir="rtl"
                aria-label="Quran Mushaf Page Verses"
              ></div>
            </div>
          </div>
        </div>

        <!-- Tactile iPod Click-Wheel Controls -->
        <div class="wheel-Area" role="group" aria-label="iPod Click-Wheel Controls">
          <div class="click-wheel">
            <button
              id="btn-menu"
              type="button"
              class="wheel-btn wheel-btn-top"
              aria-label="Toggle Track List Menu"
              aria-expanded="false"
            >
              MENU
            </button>

            <button
              id="btn-prev"
              type="button"
              class="wheel-btn wheel-btn-left"
              aria-label="Previous Track"
            >
              ⏮
            </button>

            <button
              id="btn-play"
              type="button"
              class="wheel-center-btn"
              aria-label="Play"
            >
              Play
            </button>

            <button
              id="btn-next"
              type="button"
              class="wheel-btn wheel-btn-right"
              aria-label="Next Track"
            >
              ⏭
            </button>

            <button
              id="btn-repeat"
              type="button"
              class="wheel-btn wheel-btn-bottom"
              aria-label="Repeat Mode: Repeat All"
            >
              Repeat All
            </button>
          </div>
        </div>

        <footer class="ipod-loader-bar">
          <label class="loader-btn" for="folder-input">
            Load Folder
            <input
              id="folder-input"
              type="file"
              webkitdirectory
              directory
              multiple
              hidden
            />
          </label>
          <label class="loader-btn loader-btn-secondary" for="files-input">
            Add Files
            <input
              id="files-input"
              type="file"
              accept=".m4a,.mp3,audio/mp4,audio/mpeg,audio/*"
              multiple
              hidden
            />
          </label>
          <button
            id="btn-stop"
            type="button"
            class="loader-btn loader-btn-secondary stop-mini-btn"
            aria-label="Stop Playback"
          >
            Stop
          </button>
        </footer>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
